<!doctype html>
<html lang="en">
  <head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg portfolio-navbar">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <span class="logo-box">HJ</span>
            <span class="logo-name">Hala Jabban</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>

              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" type="button">
              <i class="bi bi-moon-fill" id="themeIcon"></i>
            </button>

        </div>
      </nav>

    <main class="project-details-section">
      <div class="container">
        <nav aria-label="breadcrumb">

            <li class="breadcrumb-item active" aria-current="page">Details</li>
          </ol>
        </nav>

        <article class="project-details-card" id="projectDetails" hidden>
          <div class="project-details-icon" id="projectMedia">
            <i class="bi bi-code-square" id="projectIcon" aria-hidden="true"></i>
          </div>
          <div class="project-details-content">
            <div class="project-tags" id="projectTags"></div>
            <h1 id="projectTitle"></h1>
            <p id="projectDescription"></p>
            <div class="project-buttons" id="projectLinks"></div>
          </div>
        </article>

        <div class="project-status" id="projectStatus" role="status">
          Loading project...
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Developed by <strong>Hala Jabban</strong></p>
